[project]
name = "forma-server"
version = "0.1.0"
description = "FORMA server: runs exported FORMA pipelines on a schedule, reads databases and APIs, and offers AI-assisted extraction."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "apscheduler>=3.10,<4",
  "pandas>=2.1",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "anthropic>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
forma-server = "forma_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forma_server"]
